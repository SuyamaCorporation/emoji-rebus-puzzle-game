<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Rebus Puzzle Game</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-purple-50 min-h-screen">
<div class="max-w-2xl mx-auto p-4">
  <h1 class="text-3xl font-bold text-purple-900 mb-2 flex items-center gap-2">
    🧩 Emoji Rebus Puzzle
  </h1>
  <p class="text-gray-500 mb-6 text-sm">絵文字の並びが表す言葉・フレーズを当ててください！</p>

  <!-- Mode Tabs -->
  <div class="flex gap-2 mb-6">
    <button id="tab-play" onclick="setMode('play')" class="px-4 py-2 rounded-full font-semibold text-sm bg-purple-700 text-white" aria-label="プレイモード">プレイ</button>
    <button id="tab-create" onclick="setMode('create')" class="px-4 py-2 rounded-full font-semibold text-sm bg-gray-200 text-gray-700" aria-label="作成モード">自作モード</button>
  </div>

  <!-- Play Mode -->
  <div id="mode-play">
    <!-- Stats -->
    <div class="flex gap-4 mb-4 text-sm">
      <span class="bg-white rounded-lg px-3 py-1 shadow-sm">正解: <strong id="score">0</strong></span>
      <span class="bg-white rounded-lg px-3 py-1 shadow-sm">残りヒント: <strong id="hints">3</strong></span>
      <span class="bg-white rounded-lg px-3 py-1 shadow-sm">問題: <strong id="qNum">1</strong> / <span id="qTotal">-</span></span>
    </div>

    <!-- Difficulty -->
    <div class="flex gap-2 mb-4">
      <button onclick="setDifficulty('easy')" id="diff-easy" class="diff-btn px-3 py-1 rounded-full text-xs font-semibold bg-green-600 text-white" aria-label="Easyモード">Easy</button>
      <button onclick="setDifficulty('medium')" id="diff-medium" class="diff-btn px-3 py-1 rounded-full text-xs font-semibold bg-gray-200 text-gray-700" aria-label="Mediumモード">Medium</button>
      <button onclick="setDifficulty('hard')" id="diff-hard" class="diff-btn px-3 py-1 rounded-full text-xs font-semibold bg-gray-200 text-gray-700" aria-label="Hardモード">Hard</button>
    </div>

    <!-- Puzzle Card -->
    <div class="bg-white rounded-2xl shadow-md p-8 mb-4 text-center">
      <p id="emojiDisplay" class="text-6xl mb-6 leading-tight tracking-widest"></p>
      <input id="answer" type="text" placeholder="答えを入力..." class="w-full border-2 border-purple-200 rounded-xl px-4 py-3 text-center text-lg focus:outline-none focus:border-purple-500" aria-label="答えを入力">
      <p id="feedback" class="mt-3 font-semibold text-lg h-7"></p>
    </div>

    <div class="flex gap-3 flex-wrap">
      <button onclick="checkAnswer()" class="bg-purple-700 hover:bg-purple-800 text-white font-semibold px-6 py-2 rounded-lg transition" aria-label="答えを確認">確認</button>
      <button onclick="useHint()" class="bg-yellow-500 hover:bg-yellow-600 text-white font-semibold px-6 py-2 rounded-lg transition" aria-label="ヒントを使う">ヒント 💡</button>
      <button onclick="nextPuzzle()" class="bg-gray-500 hover:bg-gray-600 text-white font-semibold px-6 py-2 rounded-lg transition" aria-label="次の問題">スキップ →</button>
    </div>
    <p id="hint-text" class="mt-3 text-yellow-700 font-medium hidden"></p>
  </div>

  <!-- Create Mode -->
  <div id="mode-create" class="hidden">
    <div class="bg-white rounded-2xl shadow-md p-6 mb-4">
      <h2 class="text-lg font-semibold text-purple-800 mb-4">オリジナルリーバスを作成</h2>
      <div class="mb-3">
        <label for="customEmoji" class="block text-sm font-medium text-gray-700 mb-1">絵文字シーケンス</label>
        <input id="customEmoji" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-400 text-2xl" placeholder="例: 🌊🏄‍♂️">
      </div>
      <div class="mb-3">
        <label for="customAnswer" class="block text-sm font-medium text-gray-700 mb-1">答え</label>
        <input id="customAnswer" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-400" placeholder="例: サーフィン">
      </div>
      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-2">絵文字パレット</label>
        <div class="flex flex-wrap gap-1 text-2xl">
          <span id="palette"></span>
        </div>
      </div>
      <button onclick="saveCustom()" class="bg-purple-700 hover:bg-purple-800 text-white font-semibold px-5 py-2 rounded-lg transition" aria-label="保存する">保存する</button>
    </div>
    <div id="customList" class="space-y-2"></div>
    <p id="custom-empty" class="text-gray-400 text-sm text-center py-4 hidden">まだ自作問題がありません</p>
  </div>
</div>

<script>
const PUZZLES = {
  easy: [
    { emojis: '🌞🌧️', answer: '晴れのち雨', hint: '天気予報' },
    { emojis: '🍎📖', answer: 'apple book', hint: '英語で2単語' },
    { emojis: '🐶🏠', answer: 'dog house', hint: '英語 犬小屋' },
    { emojis: '🎵🐦', answer: 'song bird', hint: '英語 歌鳥' },
    { emojis: '🌙⭐', answer: 'moon star', hint: '夜空にある' },
    { emojis: '🔑🚪', answer: 'key door', hint: 'ドアを開けるもの' },
    { emojis: '☕📰', answer: 'morning coffee', hint: '朝の習慣' },
  ],
  medium: [
    { emojis: '🐝🍺', answer: 'bee beer', hint: '英語 昆虫＋飲み物' },
    { emojis: '🌊🏄', answer: 'surfing', hint: 'ウォータースポーツ' },
    { emojis: '❤️🔒', answer: 'love lock', hint: '恋人たちが橋に' },
    { emojis: '🧠💡', answer: 'bright idea', hint: '名案！' },
    { emojis: '🐱🎸', answer: 'cat guitar', hint: '動物がロックを' },
    { emojis: '☁️9️⃣', answer: 'cloud nine', hint: '英語熟語 至福の状態' },
    { emojis: '🦋🍵', answer: 'butterfly tea', hint: 'バタフライピーティー' },
  ],
  hard: [
    { emojis: '🍕🤔', answer: 'pizza pie in the sky', hint: '英語熟語' },
    { emojis: '🐱🐱🐱', answer: 'copy cat', hint: '英語熟語 模倣者' },
    { emojis: '🌶️❄️', answer: 'hot and cold', hint: '対義語' },
    { emojis: '👁️🐝🍺', answer: 'I bee beer', hint: 'I be here の発音' },
    { emojis: '🦁🦁🦁', answer: 'lion heart', hint: 'ライオンが3頭' },
    { emojis: '🌍🌍🌍', answer: 'world class', hint: '世界三つ' },
  ]
};

let mode = 'play';
let difficulty = 'easy';
let currentPool = [];
let currentIdx = 0;
let score = 0;
let hints = 3;
let answered = false;

const PALETTE_EMOJIS = ['😀','🎵','🌊','🔥','💎','🌸','🦋','🍎','🏆','🚀','❤️','🌙','⭐','🐶','🐱','🍕','🎸','🌈','☕','💡','🔑','🌍','🎭','🏄','🦁'];

function setMode(m) {
  mode = m;
  document.getElementById('mode-play').classList.toggle('hidden', m !== 'play');
  document.getElementById('mode-create').classList.toggle('hidden', m !== 'create');
  document.getElementById('tab-play').className = 'px-4 py-2 rounded-full font-semibold text-sm ' + (m === 'play' ? 'bg-purple-700 text-white' : 'bg-gray-200 text-gray-700');
  document.getElementById('tab-create').className = 'px-4 py-2 rounded-full font-semibold text-sm ' + (m === 'create' ? 'bg-purple-700 text-white' : 'bg-gray-200 text-gray-700');
  if (m === 'create') renderCustomList();
}

function setDifficulty(d) {
  difficulty = d;
  ['easy', 'medium', 'hard'].forEach(x => {
    const btn = document.getElementById('diff-' + x);
    const colorMap = { easy: 'bg-green-600', medium: 'bg-yellow-500', hard: 'bg-red-600' };
    btn.className = 'diff-btn px-3 py-1 rounded-full text-xs font-semibold ' + (x === d ? colorMap[x] + ' text-white' : 'bg-gray-200 text-gray-700');
  });
  startGame();
}

function startGame() {
  const custom = getCustomPuzzles();
  currentPool = [...PUZZLES[difficulty], ...custom].sort(() => Math.random() - 0.5);
  currentIdx = 0;
  score = 0;
  hints = 3;
  answered = false;
  updateStats();
  showPuzzle();
}

function showPuzzle() {
  if (currentIdx >= currentPool.length) {
    document.getElementById('emojiDisplay').textContent = '🎉';
    document.getElementById('feedback').textContent = 'クリア！全' + currentPool.length + '問正解: ' + score;
    document.getElementById('feedback').className = 'mt-3 font-semibold text-lg h-7 text-purple-700';
    document.getElementById('answer').value = '';
    document.getElementById('hint-text').classList.add('hidden');
    return;
  }
  const p = currentPool[currentIdx];
  document.getElementById('emojiDisplay').textContent = p.emojis;
  document.getElementById('answer').value = '';
  document.getElementById('feedback').textContent = '';
  document.getElementById('hint-text').classList.add('hidden');
  answered = false;
  updateStats();
}

function updateStats() {
  document.getElementById('score').textContent = score;
  document.getElementById('hints').textContent = hints;
  document.getElementById('qNum').textContent = Math.min(currentIdx + 1, currentPool.length);
  document.getElementById('qTotal').textContent = currentPool.length;
}

function checkAnswer() {
  if (answered) return;
  const p = currentPool[currentIdx];
  const userAns = document.getElementById('answer').value.trim().toLowerCase();
  const correct = p.answer.toLowerCase();
  const fb = document.getElementById('feedback');
  if (userAns === correct) {
    fb.textContent = '正解！ 🎉 ' + p.answer;
    fb.className = 'mt-3 font-semibold text-lg h-7 text-green-600';
    score++;
    answered = true;
    updateStats();
    setTimeout(() => { currentIdx++; showPuzzle(); }, 1200);
  } else {
    fb.textContent = '不正解... もう一度！';
    fb.className = 'mt-3 font-semibold text-lg h-7 text-red-500';
  }
}

function useHint() {
  if (hints <= 0 || answered) return;
  const p = currentPool[currentIdx];
  hints--;
  const firstChar = p.answer.slice(0, Math.ceil(p.answer.length / 3));
  const hintEl = document.getElementById('hint-text');
  hintEl.textContent = 'ヒント: ' + p.hint + ' （最初の文字: ' + firstChar + '...）';
  hintEl.classList.remove('hidden');
  updateStats();
}

function nextPuzzle() {
  currentIdx++;
  showPuzzle();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && mode === 'play') checkAnswer();
});

// Create mode
const palette = document.getElementById('palette');
PALETTE_EMOJIS.forEach(em => {
  const btn = document.createElement('button');
  btn.textContent = em;
  btn.className = 'hover:bg-purple-100 rounded p-1 transition cursor-pointer';
  btn.setAttribute('aria-label', em + 'を入力欄に追加');
  btn.onclick = () => {
    document.getElementById('customEmoji').value += em;
  };
  palette.appendChild(btn);
});

function getCustomPuzzles() {
  try { return JSON.parse(localStorage.getItem('rebusPuzzles') || '[]'); } catch(e) { return []; }
}
function saveCustomPuzzle(p) {
  const arr = getCustomPuzzles();
  arr.push(p);
  localStorage.setItem('rebusPuzzles', JSON.stringify(arr));
}
function deleteCustomPuzzle(id) {
  const arr = getCustomPuzzles().filter(p => p.id !== id);
  localStorage.setItem('rebusPuzzles', JSON.stringify(arr));
  renderCustomList();
}

function saveCustom() {
  const emojis = document.getElementById('customEmoji').value.trim();
  const answer = document.getElementById('customAnswer').value.trim();
  if (!emojis || !answer) { alert('絵文字と答えを入力してください'); return; }
  saveCustomPuzzle({ emojis, answer, hint: '自作問題', id: Date.now() });
  document.getElementById('customEmoji').value = '';
  document.getElementById('customAnswer').value = '';
  renderCustomList();
}

function renderCustomList() {
  const puzzles = getCustomPuzzles();
  const container = document.getElementById('customList');
  const empty = document.getElementById('custom-empty');
  container.innerHTML = '';
  if (puzzles.length === 0) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  puzzles.forEach(p => {
    const row = document.createElement('div');
    row.className = 'bg-white rounded-xl p-4 flex justify-between items-center shadow-sm';

    const left = document.createElement('div');
    const eEl = document.createElement('p');
    eEl.className = 'text-2xl';
    eEl.textContent = p.emojis;
    left.appendChild(eEl);
    const aEl = document.createElement('p');
    aEl.className = 'text-sm text-gray-500 mt-1';
    aEl.textContent = '答え: ' + p.answer;
    left.appendChild(aEl);

    const delBtn = document.createElement('button');
    delBtn.className = 'text-gray-300 hover:text-red-400 text-xl transition';
    delBtn.textContent = '×';
    delBtn.setAttribute('aria-label', p.emojis + 'を削除');
    delBtn.onclick = () => deleteCustomPuzzle(p.id);

    row.appendChild(left);
    row.appendChild(delBtn);
    container.appendChild(row);
  });
}

startGame();
</script>
</body>
</html>
